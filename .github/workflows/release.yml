name: Release Windows

# 推送 v* 标签即触发完整发布；也支持手动触发，仅构建 + 上传 OSS（便于排查，不发 Release）
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify README mentions the release version
        shell: pwsh
        # 每次发版都必须更新 README 的「当前版本」与「版本历史」。
        # 这里做硬校验：漏了就失败，而不是让一份过时的 README 跟着发布出去。
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $readme = Get-Content README.md -Raw
          if ($readme -notmatch [regex]::Escape($version)) {
            Write-Error "README.md 里找不到当前版本号 $version —— 请先更新 README 的「当前版本」与「版本历史」，再发版。"
            exit 1
          }
          Write-Host "README 已包含版本 $version"

      - name: Verify tag matches package.json version
        # 防止把旧代码发布成新版本：tag 名必须与 package.json 的 version 完全一致。
        # 起因：v0.1.3 曾因 commit 失败但 tag 仍被创建，导致 tag 指向旧提交。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $version) {
            Write-Error "tag v$tag 与 package.json 的版本 $version 不一致 —— tag 必须与 package.json 同版本，否则会把旧代码发布成新版本。"
            exit 1
          }
          Write-Host "tag 与 package.json 版本一致：$version"

      - name: Build and package
        # release 脚本已带 --publish never：electron-builder 只产出本地文件。
        # 发布动作交给下面的 GitHub Release 与 OSS 两步，避免它去碰 generic provider。
        run: npm run release
        env:
          # 未签名构建：不要让 electron-builder 去自动发现证书
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish to GitHub Release
        # 手动触发时没有 tag，跳过这一步（只验证构建与 OSS 上传）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # 用 electron-builder 产物的原名上传，绝不改名：
          # latest.yml 里的 url 必须与文件名完全一致，否则客户端下载 404。
          files: |
            release/DeepSeek-Harness-Desktop-Setup-*.exe
            release/DeepSeek-Harness-Desktop-*-portable.exe
          fail_on_unmatched_files: true

      - name: Upload update feed to OSS
        # 上传顺序由脚本保证：安装包 → blockmap → policy.json → latest.yml（最后）
        run: npm run upload:oss
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_REGION: ${{ vars.OSS_REGION || 'oss-cn-beijing' }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET || 'deepseek-harness-upgrade' }}
