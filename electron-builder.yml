appId: com.deepseekai.harness.desktop
productName: DeepSeek Harness Desktop
asar: false
npmRebuild: false

directories:
  output: release

files:
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: ${productName}-${version}-portable.exe

publish:
  provider: github
  owner: yic72155-lgtm
  repo: deepseek-herness-desktop
