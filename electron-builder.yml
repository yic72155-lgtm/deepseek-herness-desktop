appId: com.deepseekai.harness.desktop
productName: DeepSeek Harness Desktop
asar: true
npmRebuild: false

directories:
  output: release

files:
  - dist/**/*
  - package.json

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

portable:
  artifactName: ${productName}-${version}-portable.exe

extraResources:
  - from: build/icon.png
    to: icon.png
